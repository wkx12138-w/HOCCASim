name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: unit tests (python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy matplotlib PyYAML

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the command line
        run: |
          python scripts/run_episode.py --seed 0
          python scripts/run_episode.py --policy random --no-comm

      - name: Generate the figures headlessly
        run: python scripts/make_figures.py --only setup

  numpy-only:
    name: minimal install (numpy only, no matplotlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy only
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy
      - name: Environment must work without matplotlib
        run: python -c "
          from hocca_sim import make_env, RuleBasedPolicy
          from hocca_sim.rollout import rollout
          env = make_env(seed=0)
          roll = rollout(env, RuleBasedPolicy(), seed=0, record_frames=False)
          print('coverage', roll.metrics.coverage, 'steps', roll.steps)
          assert roll.metrics.coverage > 0.5
          "
